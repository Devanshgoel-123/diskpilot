[package]
name = "diskpilot"
version = "0.1.0"
description = "Open-source macOS storage intelligence"
authors = ["DiskPilot contributors"]
license = "MIT"
repository = "https://github.com/Devanshgoel-123/diskpilot"
edition = "2021"
rust-version = "1.80"

[lib]
name = "diskpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
libc = "0.2"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
trash = "5"
plist = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
