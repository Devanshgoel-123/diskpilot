[package]
name = "diskpilot"
version = "0.4.2"
description = "Open-source macOS storage intelligence"
authors = ["DiskPilot contributors"]
license = "MIT"
repository = "https://github.com/Devanshgoel-123/diskpilot"
edition = "2021"
rust-version = "1.82"

[lib]
name = "diskpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
libc = "0.2"
dirs = "6"
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
trash = "5"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
# Scanning waits on the file system, not the CPU: "s" makes the binary about
# 21% smaller (12.2 MB to 9.7 MB on arm64) with no measurable scan slowdown.
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
