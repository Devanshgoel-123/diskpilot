name: Windows test build

# A Windows installer for testers, built from a test/windows-* branch: runs
# the Rust and frontend tests on Windows, builds the NSIS installers (x64 and
# arm64), installs the x64 one on a clean runner and drives the app
# (.github/smoke/windows-smoke.mjs), then uploads the installers as run
# artifacts. It creates no release or tag, does not touch the update feed
# (latest.json) and uses no secrets, so the installers are unsigned.
on:
  push:
    branches: ["test/windows-*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the test build
        required: false
        default: "0.6.6"

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_VERSION: ${{ inputs.version || '0.6.6' }}

jobs:
  test:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: test
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm exec vitest run
      # tauri::generate_context! embeds the frontend; an empty dist is enough to compile.
      - run: New-Item -ItemType Directory -Force dist
        shell: pwsh
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: Installer (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # Unsigned, and without updater artifacts: the version is set for this
      # build only, nothing is committed.
      - name: Build the installer
        env:
          TARGET: ${{ matrix.target }}
        run: |
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":false}}' "$TEST_VERSION" > "$RUNNER_TEMP/test.json"
          cat "$RUNNER_TEMP/test.json"
          pnpm tauri build --ci --target "$TARGET" --bundles nsis --config "$RUNNER_TEMP/test.json"
      - name: Name the installer
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p out
          exe=$(ls src-tauri/target/$TARGET/release/bundle/nsis/DiskPilot_*-setup.exe)
          name="DiskPilot-$TEST_VERSION-windows-$ARCH-test-setup.exe"
          cp "$exe" "out/$name"
          cd out
          sha256sum "$name" | tee "$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiskPilot-windows-${{ matrix.arch }}-test-setup
          path: out/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Install and drive the app (x64)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DiskPilot-windows-x64-test-setup
          path: installer

      - name: Make things for DiskPilot to find
        shell: pwsh
        run: |
          $h = $env:USERPROFILE
          $nm = "$h\Projects\old-app\node_modules\left-pad"
          New-Item -ItemType Directory -Force $nm | Out-Null
          Set-Content "$h\Projects\old-app\package.json" '{"name":"old-app","version":"1.0.0"}'
          1..200 | ForEach-Object { fsutil file createnew "$nm\chunk$_.js" 262144 | Out-Null }
          New-Item -ItemType Directory -Force "$h\Downloads", "$h\Videos" | Out-Null
          fsutil file createnew "$h\Downloads\big-installer.msi" 314572800 | Out-Null
          fsutil file createnew "$h\Videos\screen-recording.mp4" 209715200 | Out-Null
          $bytes = [byte[]]::new(5MB); (New-Object Random 7).NextBytes($bytes)
          [IO.File]::WriteAllBytes("$h\Downloads\photo.jpg", $bytes)
          [IO.File]::WriteAllBytes("$h\Videos\photo (copy).jpg", $bytes)
          # A made-up Anthropic-style key in an agent transcript.
          $key = 'sk-' + 'ant-api03-' + (-join ((65..90) + (97..122) | Get-Random -Count 40 | ForEach-Object { [char]$_ }))
          New-Item -ItemType Directory -Force "$h\.claude\projects\demo" | Out-Null
          Set-Content "$h\.claude\projects\demo\session.jsonl" "{`"role`":`"user`",`"content`":`"my key is $key`"}"
          # Past the first-launch email signup without sending anything:
          # a signup already marked as sent.
          $data = "$env:APPDATA\dev.diskpilot.app"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\signup.json" '{"email":"ci@diskpilot.invalid","signedUpAtMs":1,"sent":true}'
          Get-ChildItem $h -Force | Format-Table Name, Length

      - name: Install
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter *-setup.exe | Select-Object -First 1
          "Installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "The installer failed" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter DiskPilot.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "DiskPilot.exe not found after install" }
          "Installed: $($exe.FullName)"
          "EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem $exe.DirectoryName | Format-Table Name, Length
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { $_.GetValue('DisplayName') -like '*DiskPilot*' } | ForEach-Object { $_.GetValue('DisplayName') + ' ' + $_.GetValue('DisplayVersion') }

      - name: Run and drive the app
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $app = Start-Process $env:EXE -PassThru
          Start-Sleep 5
          "Running: $(-not $app.HasExited)"
          node .github/smoke/windows-smoke.mjs smoke-results
          $code = $LASTEXITCODE
          $alive = Get-Process -Id $app.Id -ErrorAction SilentlyContinue
          "Still running after the test: $([bool]$alive)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke-results\desktop.png")
          if (-not $alive) { throw "DiskPilot exited during the smoke test" }
          exit $code

      - name: Logs and crash reports
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-results | Out-Null
          foreach ($d in "$env:APPDATA\dev.diskpilot.app", "$env:LOCALAPPDATA\dev.diskpilot.app") {
            if (Test-Path $d) { Get-ChildItem $d -Recurse | Format-Table FullName, Length | Out-String | Add-Content smoke-results\app-data.txt
              Get-ChildItem $d -Recurse -Include *.log | ForEach-Object { Copy-Item $_ smoke-results\ } }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'DiskPilot|WebView' } | Format-List TimeCreated, ProviderName, Message | Out-File smoke-results\event-log.txt
          Get-Process DiskPilot -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          if (-not $env:EXE) { exit 0 }
          $dir = Split-Path $env:EXE
          $un = Get-ChildItem $dir -Filter 'uninstall*.exe' | Select-Object -First 1
          $p = Start-Process $un.FullName -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5
          "Uninstaller exit code: $($p.ExitCode)" | Tee-Object -Append smoke-results\log.txt
          "App removed: $(-not (Test-Path $env:EXE))" | Tee-Object -Append smoke-results\log.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-smoke-results
          path: smoke-results
          retention-days: 14
