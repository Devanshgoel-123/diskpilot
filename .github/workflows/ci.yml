name: CI

on:
  push:
    branches: [main, "feat/windows*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  engine:
    name: Rust engine (fmt, clippy, tests)
    # macOS runners cost ten times the minutes in a private repository, so
    # the private development copy relies on running these checks locally.
    if: github.repository == 'Devanshgoel-123/diskpilot'
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the frontend; an empty dist is enough to compile.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  engine-windows:
    name: Rust engine on Windows (clippy, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the frontend; an empty dist is enough to compile.
      - run: New-Item -ItemType Directory -Force ../dist
        shell: pwsh
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  installer-windows:
    name: Windows installer (${{ matrix.arch }})
    # Only for the Windows work, so it can be installed and tried on a PC.
    if: startsWith(github.ref, 'refs/heads/feat/windows')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # Tauri runs `pnpm build` (the frontend) first, then builds the app and
      # the NSIS installer. Unsigned and without an update archive.
      - run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiskPilot-windows-${{ matrix.arch }}-setup
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
