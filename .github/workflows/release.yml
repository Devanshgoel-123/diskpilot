name: Release

# Builds the universal macOS app and the Windows installers (x64 and arm64)
# from the tagged source on GitHub's runners and publishes them as a GitHub
# release with SHA-256 checksums and signed build provenance attestations.
# Release notes come from docs/releases/<tag>.md.
#
# The build job can only read the repository. Publishing runs in a separate
# job with no checkout and no build scripts, so a compromised dependency
# cannot use a write token. Every action is pinned to a full commit SHA.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    name: Build (macOS universal)
    # Releases are published only from the public repository, never from
    # the private development copy.
    if: github.repository == 'Devanshgoel-123/diskpilot'
    runs-on: macos-15-intel
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      # The tag, the app's version and the update manifest must agree, or
      # every installed copy refuses the update. A published release cannot
      # be changed, so this stops the build before anything is made.
      - name: Check the versions match the tag
        run: python3 scripts/check_release_versions.py "$TAG"
      # Release notes live on main; a tag may predate them.
      - name: Fetch release notes from main
        run: |
          git fetch --depth=1 origin main
          git show "origin/main:docs/releases/${TAG}.md" > "$RUNNER_TEMP/notes.md" 2>/dev/null || echo "DiskPilot ${TAG}" > "$RUNNER_TEMP/notes.md"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Signing with a Developer ID and notarizing need an Apple Developer
      # account; see docs/RELEASING.md. Without these secrets the app is
      # signed ad hoc, as before, and macOS asks users to confirm on first open.
      - name: Use Developer ID signing and notarization when configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Developer ID configured: building with an ad hoc signature."
            exit 0
          fi
          # Half a configuration must not quietly ship an ad hoc build.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty; set all six signing secrets (docs/RELEASING.md)."
              exit 1
            fi
          done
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n\r ')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          fi
          echo "NOTARIZE=1" >> "$GITHUB_ENV"
      # With the updater key, Tauri also builds a signed update archive
      # (DiskPilot.app.tar.gz) that the app verifies before installing.
      - name: Build universal app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
              echo "::error::Set the updater public key in tauri.conf.json before releasing."
              exit 1
            fi
            echo "UPDATER=1" >> "$GITHUB_ENV"
            pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater key: building without an update archive."
            pnpm tauri build --target universal-apple-darwin
          fi
      # Tauri notarizes the app inside; the disk image people download is
      # notarized and stapled too, so opening it never shows a warning.
      - name: Notarize the disk image
        if: env.NOTARIZE == '1'
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/DiskPilot_*_universal.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
      - name: Verify signature and architectures
        run: |
          # Gatekeeper checks reach Apple's servers; retry brief network drops.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Retrying in 15 s ($i)"; sleep 15; done; "$@"; }
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskPilot.app
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/diskpilot" | grep -q "x86_64 arm64"
          if [ "${NOTARIZE:-}" = "1" ]; then
            retry xcrun stapler validate "$app"
            retry spctl --assess --type execute --verbose=2 "$app"
            dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/DiskPilot_*_universal.dmg)
            retry xcrun stapler validate "$dmg"
            retry spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          fi
          if [ "${UPDATER:-}" = "1" ]; then
            # The update must contain the same notarized, stapled app.
            archive=src-tauri/target/universal-apple-darwin/release/bundle/macos/DiskPilot.app.tar.gz
            test -s "$archive.sig"
            # Signed with the key the app trusts, not just signed.
            python3 scripts/check_update_key.py src-tauri/tauri.conf.json "$archive.sig"
            mkdir -p "$RUNNER_TEMP/update-check"
            tar -xzf "$archive" -C "$RUNNER_TEMP/update-check"
            codesign --verify --deep --strict "$RUNNER_TEMP/update-check/DiskPilot.app"
            if [ "${NOTARIZE:-}" = "1" ]; then
              retry xcrun stapler validate "$RUNNER_TEMP/update-check/DiskPilot.app"
            fi
          fi
      - name: Prepare assets
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/DiskPilot_*_universal.dmg out/DiskPilot.dmg
          if [ "${UPDATER:-}" = "1" ]; then
            bundle=src-tauri/target/universal-apple-darwin/release/bundle/macos
            cp "$bundle/DiskPilot.app.tar.gz" out/DiskPilot.app.tar.gz
            # The manifest the app reads from releases/latest: version, notes,
            # and the archive's signature for both Apple silicon and Intel.
            python3 - "$TAG" "$GITHUB_REPOSITORY" "$bundle/DiskPilot.app.tar.gz.sig" "$RUNNER_TEMP/notes.md" > out/latest.json <<'PYEOF'
          import datetime, json, sys
          tag, repo, sig_path, notes_path = sys.argv[1:5]
          url = f"https://github.com/{repo}/releases/download/{tag}/DiskPilot.app.tar.gz"
          entry = {"signature": open(sig_path).read().strip(), "url": url}
          print(json.dumps({
              "version": tag.lstrip("v"),
              "notes": open(notes_path).read(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": entry, "darwin-x86_64": entry},
          }, indent=2))
          PYEOF
          fi
          cd out
          shasum -a 256 DiskPilot.dmg > DiskPilot.dmg.sha256
          if [ -f DiskPilot.app.tar.gz ]; then
            shasum -a 256 DiskPilot.app.tar.gz > DiskPilot.app.tar.gz.sha256
          fi
          cp "$RUNNER_TEMP/notes.md" notes.md
          {
            echo
            echo "## Verify the download"
            echo
            echo "SHA-256 of \`DiskPilot.dmg\`:"
            echo
            echo '```'
            cut -d' ' -f1 DiskPilot.dmg.sha256
            echo '```'
            echo
            echo "Check it with \`shasum -a 256 DiskPilot.dmg\`."
            echo
            echo "To confirm this DMG was built by this repository's release workflow:"
            echo
            echo '```'
            echo 'gh attestation verify DiskPilot.dmg -R Devanshgoel-123/diskpilot'
            echo '```'
          } >> notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build (Windows ${{ matrix.arch }})
    if: github.repository == 'Devanshgoel-123/diskpilot'
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            platform: windows-x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            platform: windows-aarch64
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check the versions match the tag
        run: python scripts/check_release_versions.py "$TAG"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The installer is unsigned until a code signing certificate is set up
      # (docs/RELEASING.md). Then WINDOWS_SIGN_COMMAND holds Tauri's
      # bundle.windows.signCommand, for example
      #   trusted-signing-cli -e <endpoint> -a <account> -c <profile> %1
      # and every binary and the installer are signed with it. Windows
      # SmartScreen warns about unsigned installers.
      # With the updater key, Tauri also signs the installer for the updater
      # (DiskPilot_..._setup.exe.sig), which the app verifies before installing.
      - name: Build the installer
        env:
          TARGET: ${{ matrix.target }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER=1" >> "$GITHUB_ENV"
          else
            echo "No updater key: building without an update signature."
          fi
          if [ -z "$WINDOWS_SIGN_COMMAND" ]; then
            echo "No Windows signing configured: the installer is unsigned."
          fi
          python - "$RUNNER_TEMP/build.json" <<'PYEOF'
          import json, os, sys
          conf = {"bundle": {}}
          if os.environ.get("TAURI_SIGNING_PRIVATE_KEY"):
              conf["bundle"]["createUpdaterArtifacts"] = True
          if os.environ.get("WINDOWS_SIGN_COMMAND"):
              conf["bundle"]["windows"] = {"signCommand": os.environ["WINDOWS_SIGN_COMMAND"]}
          json.dump(conf, open(sys.argv[1], "w"))
          PYEOF
          pnpm tauri build --ci --target "$TARGET" --bundles nsis --config "$RUNNER_TEMP/build.json"
      - name: Check the update signature
        if: env.UPDATER == '1'
        run: |
          exe=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/nsis/DiskPilot_*-setup.exe)
          test -s "$exe.sig"
          python scripts/check_update_key.py src-tauri/tauri.conf.json "$exe.sig"
      - name: Prepare assets
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p out
          name="DiskPilot-Setup-$ARCH.exe"
          exe=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/nsis/DiskPilot_*-setup.exe)
          cp "$exe" "out/$name"
          if [ "${UPDATER:-}" = "1" ]; then
            cp "$exe.sig" "out/$name.sig"
            # This platform's entry for latest.json; the publish job merges it.
            python - "$TAG" "$GITHUB_REPOSITORY" "$name" "$exe.sig" "$PLATFORM" > "out/$PLATFORM.json" <<'PYEOF'
          import json, sys
          tag, repo, name, sig_path, platform = sys.argv[1:6]
          print(json.dumps({platform: {
              "signature": open(sig_path).read().strip(),
              "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
          }}))
          PYEOF
          fi
          cd out
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [macos, windows]
    if: github.repository == 'Devanshgoel-123/diskpilot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-windows-*
          path: out
          merge-multiple: true
      - name: Check the checksums
        working-directory: out
        run: sha256sum -c DiskPilot*.sha256
      # One update manifest for every platform: the Windows entries join the
      # macOS ones. Without an updater key there is no manifest at all.
      - name: Add Windows to the update manifest
        working-directory: out
        run: |
          if [ ! -f latest.json ]; then
            rm -f windows-*.json
            exit 0
          fi
          python3 - <<'PYEOF'
          import glob, json, os
          manifest = json.load(open("latest.json"))
          for part in sorted(glob.glob("windows-*.json")):
              manifest["platforms"].update(json.load(open(part)))
              os.remove(part)
          missing = {"windows-x86_64", "windows-aarch64"} - manifest["platforms"].keys()
          if missing:
              raise SystemExit(f"::error::No update signature for {sorted(missing)}")
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PYEOF
      - name: Add the Windows downloads to the release notes
        working-directory: out
        run: |
          {
            echo
            echo "SHA-256 of the Windows installers:"
            echo
            echo '```'
            cat DiskPilot-Setup-*.exe.sha256
            echo '```'
            echo
            echo "Check one in PowerShell with \`Get-FileHash DiskPilot-Setup-x64.exe\`."
          } >> notes.md
      # A signed record, kept by GitHub outside the release, of which workflow
      # run and commit built this DMG. Check it with:
      #   gh attestation verify DiskPilot.dmg -R Devanshgoel-123/diskpilot
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            out/DiskPilot.dmg
            out/DiskPilot-Setup-*.exe
      # A published DMG is never replaced. To rebuild a release, delete it
      # first, deliberately, and the new build gets a new attestation.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: out
        run: |
          files="DiskPilot.dmg DiskPilot.dmg.sha256"
          files="$files $(ls DiskPilot-Setup-*.exe DiskPilot-Setup-*.exe.sha256 | tr '\n' ' ')"
          if [ -f latest.json ]; then
            files="$files DiskPilot.app.tar.gz DiskPilot.app.tar.gz.sha256 latest.json"
            files="$files $(ls DiskPilot-Setup-*.exe.sig | tr '\n' ' ')"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx DiskPilot.dmg; then
              echo "::error::$TAG already has DiskPilot.dmg. Published files are never replaced."
              exit 1
            fi
            gh release upload "$TAG" $files
            gh release edit "$TAG" --notes-file notes.md
          else
            # A draft: only the maintainer sees it until the downloaded DMG
            # has been checked and the release is published by hand.
            gh release create "$TAG" $files \
              --verify-tag --draft --title "DiskPilot ${TAG#v}" --notes-file notes.md
          fi

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # A fine-grained token with Contents: write on Devanshgoel-123/homebrew-tap
      # only. Without it this job does nothing.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: out
      # Releases start as drafts, which the public API cannot see. Until the
      # release is published this job skips; re-run it after publishing.
      - name: Check the release is published
        id: published
        if: env.TAP_TOKEN != ''
        run: |
          # Authenticated, so a shared runner's rate limit is not mistaken
          # for a draft. Drafts are not visible by tag: 404 means "not yet".
          draft=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .draft 2>err.txt) || {
            if grep -q "HTTP 404" err.txt; then
              echo "::notice::$TAG is still a draft; re-run this job after publishing it."
              exit 0
            fi
            cat err.txt; exit 1
          }
          [ "$draft" = "false" ] && echo "yes=1" >> "$GITHUB_OUTPUT"
      - name: Bump the cask
        if: env.TAP_TOKEN != '' && steps.published.outputs.yes == '1'
        run: |
          version="${TAG#v}"
          sha="$(cut -d' ' -f1 out/DiskPilot.dmg.sha256)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version $version"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Devanshgoel-123/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"$/  version \"${version}\"/; s/^  sha256 \".*\"$/  sha256 \"${sha}\"/" Casks/diskpilot.rb
          git diff --exit-code --quiet && { echo "Cask already at $version"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "diskpilot ${version}"
          git push
      - name: Note when the tap is not updated
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; update Casks/diskpilot.rb in the tap by hand."
