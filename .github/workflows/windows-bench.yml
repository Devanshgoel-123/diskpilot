name: Windows scan benchmark

# Times the Windows scanner on a real runner: the batched listing against
# read_dir, listing buffer sizes, and the NTFS file-table scan (runners are
# administrators). Manual, plus pushes to the scanner branch.
on:
  push:
    branches: ["feat/windows-scan"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
        shell: pwsh
    env:
      # Optimized but quick to build; the benchmark measures I/O.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: bench
      - run: New-Item -ItemType Directory -Force ../dist
      # The scanner's own tests, which the engine-windows job does not reach
      # while other modules' tests still fail on Windows.
      - name: Scanner tests
        run: |
          cargo test --release --locked --lib scanner
          cargo test --release --locked --test scan
      - run: cargo build --release --locked --example scan_bench
      - name: Listing buffer sizes (C:\Windows)
        run: |
          $env:BUF = "16,64,256,1024"
          ./target/release/examples/scan_bench.exe C:\Windows 3
      - name: read_dir (C:\Windows)
        run: |
          $env:PORTABLE = "1"
          ./target/release/examples/scan_bench.exe C:\Windows 3
      - name: File table (C:\Windows)
        run: |
          $env:FAST = "1"
          ./target/release/examples/scan_bench.exe C:\Windows 3
      - name: Whole drive, batched listing
        run: ./target/release/examples/scan_bench.exe C:\ 2
      - name: Whole drive, file table
        run: |
          $env:FAST = "1"
          ./target/release/examples/scan_bench.exe C:\ 2
