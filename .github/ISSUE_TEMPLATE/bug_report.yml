name: Bug report
description: Something in DiskPilot does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** paste full file paths or folder listings that reveal personal information; replace names with placeholders.
        Security issues: please follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan ~/...
        2. Open Storage Explorer
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DiskPilot version
      description: Shown in Settings → About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.1, Apple M2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
