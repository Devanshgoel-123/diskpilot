<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C9BFF"/>
      <stop offset="1" stop-color="#7B4DF2"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDFF"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <path d="M120 300 Q140 120 300 104 L724 104 Q860 112 900 220" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="20" stroke-linecap="round"/>

  <!-- storage ring -->
  <circle cx="512" cy="540" r="318" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="40"/>
  <path d="M512 222 A318 318 0 0 1 822 470" fill="none" stroke="#5EEAD4" stroke-width="40" stroke-linecap="round"/>
  <path d="M818 620 A318 318 0 0 1 640 831" fill="none" stroke="#FCD34D" stroke-width="40" stroke-linecap="round"/>
  <path d="M520 858 A318 318 0 0 1 220 680" fill="none" stroke="#F9A8D4" stroke-width="40" stroke-linecap="round"/>

  <!-- disk face -->
  <circle cx="512" cy="540" r="262" fill="url(#face)"/>

  <!-- goggles strap and lenses -->
  <path d="M262 452 Q512 380 762 452" fill="none" stroke="#3B2A7A" stroke-width="40" stroke-linecap="round"/>
  <circle cx="420" cy="420" r="74" fill="#3B2A7A"/>
  <circle cx="604" cy="420" r="74" fill="#3B2A7A"/>
  <circle cx="420" cy="420" r="52" fill="url(#lens)"/>
  <circle cx="604" cy="420" r="52" fill="url(#lens)"/>
  <circle cx="400" cy="400" r="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="584" cy="400" r="14" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- eyes -->
  <ellipse cx="438" cy="580" rx="30" ry="40" fill="#1E1B4B"/>
  <ellipse cx="586" cy="580" rx="30" ry="40" fill="#1E1B4B"/>
  <circle cx="448" cy="566" r="11" fill="#FFFFFF"/>
  <circle cx="596" cy="566" r="11" fill="#FFFFFF"/>

  <!-- cheeks and smile -->
  <ellipse cx="370" cy="650" rx="40" ry="24" fill="#FB7185" fill-opacity="0.45"/>
  <ellipse cx="654" cy="650" rx="40" ry="24" fill="#FB7185" fill-opacity="0.45"/>
  <path d="M474 652 Q512 694 550 652" fill="none" stroke="#1E1B4B" stroke-width="18" stroke-linecap="round"/>
</svg>
